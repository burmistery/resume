name: Build resume

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  convert_via_pandoc:
    runs-on: ubuntu-latest

    steps:
      - uses: docker://pandoc/core:3.8
        with:
          args: >-
            resume.md
            --output=output/resume.pdf
      - uses: actions/upload-artifact@v4
        with:
          name: output
          path: output
