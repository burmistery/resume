name: Build CV

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: pandoc/latex:latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build PDF
        run: |
          pandoc resume.md \
            --template=resume.tex \
            --pdf-engine=xelatex \
            -o Vladimir_Burmistrov_CV.pdf

      - name: Upload PDF
        uses: actions/upload-artifact@v4
        with:
          name: resume
          path: Vladimir_Burmistrov_CV.pdf
