name: Build CV

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  OUTPUT_NAME: Vladimir_Burmistrov_CV.pdf

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: pandoc/latex:latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install LaTeX packages
        run: |
          apk add --no-cache \
            fonts-dejavu-core \
            ttf-dejavu

          tlmgr update --self
          tlmgr install \
            enumitem \
            fontspec \
            geometry \
            hyperref \
            parskip \
            titlesec \
            xcolor

      - name: Build PDF
        run: |
          pandoc CV.md \
            --template=CV.tex \
            --pdf-engine=xelatex \
            -o "$OUTPUT_NAME"

      - name: Upload PDF
        uses: actions/upload-artifact@v4
        with:
          name: CV
          path: ${{ env.OUTPUT_NAME }}
