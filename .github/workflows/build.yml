name: Build CV

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  OUTPUT_NAME: Vladimir_Burmistrov_CV.pdf

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: pandoc/latex:latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install LaTeX packages
        run: |
          apk add --no-cache \
            font-dejavu \
            ttf-dejavu

          tlmgr update --self
          tlmgr install \
            enumitem \
            fontspec \
            geometry \
            hyperref \
            parskip \
            titlesec \
            xcolor

      - name: Build PDF
        run: |
          pandoc CV.md \
            --template=CV.tex \
            --pdf-engine=xelatex \
            -o "$OUTPUT_NAME"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: cv-${{ github.run_number }}
          name: CV ${{ github.run_number }}
          body: "Automated CV build"
          files: ${{ env.OUTPUT_NAME }}
          draft: false
          prerelease: false
